services:
  daily_news:
    build:
      context: ../..
      dockerfile: modules/daily_news/Dockerfile
    env_file: ../../.env
    volumes:
      - ../../data:/app/data
    restart: "no"
    # Run container as host user to prevent root-owned files in mounted volumes
    user: "${DOCKER_UID}:${DOCKER_GID}"

  scheduler:
    build:
      context: ../..
      dockerfile: modules/daily_news/Dockerfile
    env_file: ../../.env
    volumes:
      - ../../data:/app/data
      - ../../shared:/app/shared
    restart: unless-stopped
    # Run container as host user to prevent root-owned files in mounted volumes
    user: "${DOCKER_UID}:${DOCKER_GID}"
    command: python3 -m shared.scheduler.scheduler_service
  
  