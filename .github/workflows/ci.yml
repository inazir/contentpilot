name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt || true; fi

      - name: Run test scripts
        env:
          PUBLISH_MODE: mock
          NOTIFY_ON_FAIL: false
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          set -e
          PYTHONPATH=. python3 scripts/test_runtime_lock.py
          PYTHONPATH=. python3 scripts/test_runtime_metadata.py
          PYTHONPATH=. python3 scripts/test_runtime_failure.py
          PYTHONPATH=. python3 scripts/test_facebook_mock.py
          PYTHONPATH=. python3 scripts/test_publish_pipeline.py
          PYTHONPATH=. python3 scripts/test_duplicate_detection.py
          PYTHONPATH=. python3 scripts/test_facebook_failure.py
