version: "3.9"

services:
  mietvertrag:
    build: .
    container_name: mietvertrag
    restart: unless-stopped
    ports:
      - "3010:3010"
    # No volumes needed – it's a static build baked into the image

# To deploy:
#   docker compose up -d --build
#
# To update after code changes:
#   docker compose down && docker compose up -d --build
#
# Host Nginx proxies mietvertrag.mycontentpilot.de → localhost:3010
